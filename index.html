<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Handayani Viewer</title>

<style>
    body{margin:0;overflow:hidden;background:#181818;}
    canvas{display:block;}
    #info{position:absolute;top:10px;width:100%;text-align:center;color:white;
        font-family:sans-serif;text-shadow:1px 1px 3px black;pointer-events:none;
        opacity:0;transition:.8s;}
    #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
        color:white;background:#000a;padding:18px 25px;border-radius:10px;font-family:sans-serif;}

    #startScreen{
        position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;
        display:flex;align-items:center;justify-content:center;flex-direction:column;gap:25px;
        z-index:20;color:white;font-family:sans-serif;text-align:center;
        animation:fadeIn 1.2s;}
    #startScreen h1{font-size:32px;margin-bottom:8px;}
    #startScreen button{
        background:#ff4fa3;border:none;padding:16px 36px;border-radius:14px;color:white;
        font-size:18px;font-weight:700;cursor:pointer;transition:.25s;
        box-shadow:0 0 12px rgba(255,80,160,.5);}
    #startScreen button:hover{
        background:#ff2f9b;transform:scale(1.08);
        box-shadow:0 0 20px rgba(255,80,160,.8);}
    @keyframes fadeOut{from{opacity:1;}to{opacity:0;pointer-events:none;}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>

<body>

<div id="startScreen">
    <h1>Welcome to Aula Handayani</h1>
    <button onclick="startExperience()">Enter</button>
</div>

<div id="info"><b>L</b> Room Lights · <b>Y</b> Wall Strips · click = show mesh name</div>
<div id="loading">Loading Aula...</div>

<script type="importmap">
{"imports":{
    "three":"https://unpkg.com/three@0.168.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.168.0/examples/jsm/"
}}
</script>

<script type="module">

import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {DRACOLoader} from "three/addons/loaders/DRACOLoader.js";
import {KTX2Loader} from "three/addons/loaders/KTX2Loader.js";
import {MeshoptDecoder} from "three/addons/libs/meshopt_decoder.module.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";
import { Raycaster, Vector2 } from "three";

// ========================== SCENE ==========================
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.6,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.58;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x202020);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment()).texture;
scene.environmentIntensity=0.22;

// ========================== LIGHTS ==========================
let lamp = true;      // main white lights on/off
let stripsOn = true;  // yellow wall strips on/off

const ambient = new THREE.AmbientLight(0xffffff,0.25);
const dirLight = new THREE.DirectionalLight(0xffffff,0.7);
const hemi = new THREE.HemisphereLight(0xe8f4ff,0x9db2c4,0.22);
dirLight.position.set(5,10,7);

scene.add(ambient,dirLight,hemi);

// ========================== CONTROLS (simple orbit only) ==========================
const orbit=new OrbitControls(camera,renderer.domElement);

// ========================== CLICK-TO-GET MESH NAME ==========================
const ray=new Raycaster(),mouse=new Vector2();
window.addEventListener("click",e=>{
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse,camera);
    const h=ray.intersectObjects(scene.children,true);
    if(h.length>0) console.log("🟩 You clicked →",h[0].object.name);
});

// ========================== LOAD SCENE MODEL ==========================

const loader=new GLTFLoader();
loader.setDRACOLoader(new DRACOLoader().setDecoderPath("https://unpkg.com/three@0.168.0/examples/jsm/libs/draco/"));
loader.setKTX2Loader(new KTX2Loader().setTranscoderPath("https://unpkg.com/three@0.168.0/examples/jsm/libs/basis/").detectSupport(renderer));
loader.setMeshoptDecoder(MeshoptDecoder);

const stripMeshes = [];
const stripNames = [
    "Cube001_1" 
];

loader.load("Aula3DModel.glb",g=>{
    const model=g.scene;
    scene.add(model);

    // 🖥 TV SCREEN IMAGE
    model.traverse(o=>{
        if(o.isMesh && ["Box001","Box001003","Box001004"].includes(o.name)){
            const tvTexture=new THREE.TextureLoader().load("image2.jpg");
            tvTexture.center.set(0.5,0.5);
            tvTexture.rotation=Math.PI/2;
            o.material=new THREE.MeshBasicMaterial({map:tvTexture,toneMapped:false});
        }
    });

    // ✨ YELLOW WALL STRIPS (emissive)
    model.traverse(o=>{
        if(o.isMesh && stripNames.includes(o.name)){
            const mat = new THREE.MeshStandardMaterial({
                color: 0xfff4d4,                   // pale warm
                emissive: 0xffc15a,               // strong yellow/orange
                emissiveIntensity: 2.5,           // brightness of glow
                roughness: 0.3,
                metalness: 0.0
            });
            o.material = mat;
            stripMeshes.push(mat);
            console.log("⚡ Strip material applied:", o.name);
        }
    });

    camera.position.set(0.5,1.75,-1.9);
    camera.lookAt(0,1.75,0);
    document.getElementById("loading").remove();
});

// ========================== KEY CONTROLS ==========================
window.addEventListener("keydown", e=>{
    const k = e.key.toLowerCase();

    // L = main white lights
    if(k==="l"){
        lamp = !lamp;
        ambient.intensity  = lamp ? 0.25 : 0.02;
        dirLight.intensity = lamp ? 0.7  : 0.05;
        hemi.intensity     = lamp ? 0.22 : 0.03;
        console.log("💡 Room lights:", lamp?"ON":"OFF");
    }

    // Y = yellow wall strips (emissive)
    if(k==="y"){
        stripsOn = !stripsOn;
        const intensity = stripsOn ? 2.5 : 0.0;
        stripMeshes.forEach(m => m.emissiveIntensity = intensity);
        console.log("🟡 Wall strips:", stripsOn?"ON":"OFF");
    }
});

// ========================== RENDER ==========================
addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
const loop=()=>{requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera);}
loop();

// ========================== START BUTTON ==========================
window.startExperience=()=>{
    document.getElementById("startScreen").style.animation="fadeOut 1s forwards";
    setTimeout(()=>document.getElementById("info").style.opacity=1,800);
};

</script>
</body>
</html>
