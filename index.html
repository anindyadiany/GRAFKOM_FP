<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Viewer - Clean Lighting + Walk Mode</title>
<style>
    body { margin:0; overflow:hidden; background:#222; }
    canvas { display:block; }
    #info{
        position:absolute; top:10px; width:100%; text-align:center;
        color:white; font-family:sans-serif; pointer-events:none;
        text-shadow:1px 1px 3px black; z-index:10;
    }
    #loading{
        position:absolute; top:50%; left:50%;
        transform:translate(-50%,-50%);
        color:white; background:rgba(0,0,0,.7);
        padding:20px 30px; border-radius:10px;
    }
</style>
</head>

<body>

<div id="info">
    <b>1</b> Orbit View  |  
    <b>2</b> Walk Mode — WASD + Mouse Look  
    <br>Left-Click = Enable Look · Right-Click = Orbit · Scroll = Zoom
</div>
<div id="loading">Loading Classroom...</div>

<script type="importmap">
{
 "imports":{
   "three":"https://unpkg.com/three@0.168.0/build/three.module.js",
   "three/addons/":"https://unpkg.com/three@0.168.0/examples/jsm/"
 }
}
</script>

<script type="module">
/* ───────────────── Imports ───────────────── */
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* ───────────────── Scene ───────────────── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);

/* ───────────────── Camera ───────────────── */
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);

/* ───────────────── Renderer ───────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/*** 🔥 Restore original visual tone (fix yellow ceiling) ***/
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
scene.environmentIntensity = 0.50;

/* ───────────────── Environment HDRI ───────────────── */
scene.environment = new THREE.PMREMGenerator(renderer)
    .fromScene(new RoomEnvironment()).texture;

/* ───────────────── Neutral Lighting ───────────────── */
scene.add(new THREE.AmbientLight(0xffffff,0.45));

const dirLight = new THREE.DirectionalLight(0xffffff,1.2);
dirLight.position.set(6,12,4);
dirLight.castShadow = true;
scene.add(dirLight);

scene.add(new THREE.HemisphereLight(0xffffff,0xffffff,0.35));


/* ╔══════════════════════════════════╗
   ║ 🚶 WALKING MOVEMENT SYSTEM       ║
   ╚══════════════════════════════════╝ */
let mode="orbit";

const orbit = new OrbitControls(camera,renderer.domElement);
orbit.enableDamping = true;

const fp = new PointerLockControls(camera,document.body);

let move = {w:false,a:false,s:false,d:false};
let velocity=new THREE.Vector3(), direction=new THREE.Vector3();

const PLAYER_HEIGHT=1.75, WALK_SPEED=6, ACCEL=20, DRAG=8;
camera.position.y=PLAYER_HEIGHT;

document.addEventListener("keydown",e=>{ if(move[e.key]!=null) move[e.key]=true; });
document.addEventListener("keyup",e=>{ if(move[e.key]!=null) move[e.key]=false; });

window.addEventListener("keydown",e=>{
    if(e.key==="1"){mode="orbit"; orbit.enabled=true; fp.unlock();}
    if(e.key==="2"){mode="first"; orbit.enabled=false; fp.lock();}
});
document.addEventListener("click",()=> mode==="first" && fp.lock());

function updateWalk(dt){
    direction.set(
        (move.d?-1:0)+(move.a?1:0),
        0,
        (move.w?-1:0)+(move.s?1:0)
    ).normalize();

    velocity.x += direction.x * ACCEL * dt;
    velocity.z += direction.z * ACCEL * dt;
    velocity.multiplyScalar(1 - DRAG*dt);

    fp.moveRight(-velocity.x*dt*WALK_SPEED);
    fp.moveForward(-velocity.z*dt*WALK_SPEED);
}


/* ───────────────── Load Classroom Model ───────────────── */
const loader = new GLTFLoader();
loader.setDRACOLoader(new DRACOLoader().setDecoderPath("https://unpkg.com/three@0.168.0/examples/jsm/libs/draco/"));
loader.setKTX2Loader(new KTX2Loader().setTranscoderPath("https://unpkg.com/three@0.168.0/examples/jsm/libs/basis/").detectSupport(renderer));
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load("Aula3DModel.glb",gltf=>{
    scene.add(gltf.scene);

    const box=new THREE.Box3().setFromObject(gltf.scene);
    const center=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());
    const m=Math.max(size.x,size.y,size.z);

    camera.position.set(m*2,PLAYER_HEIGHT,m*2);
    orbit.target.copy(center);

    document.getElementById("loading").remove();
});


/* ───────────────── Resize ───────────────── */
addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

/* ───────────────── Animation Loop ───────────────── */
const clock=new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);

    if(mode==="first") updateWalk(clock.getDelta());
    else orbit.update();

    renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
